<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Gumball machine</title>
<style>
  :root{--ink:#2a1f1a;--paper:#fbf4e6;--tomato:#e4572e;--mustard:#e8b23a;--mint:#8fd1b5;--cobalt:#2f5bb7;--blush:#f2a7a0}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:18px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}
  main{max-width:30rem;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:max(.6rem,env(safe-area-inset-top)) .9rem max(.9rem,env(safe-area-inset-bottom))}
  .top{display:flex;align-items:center;gap:.5rem}
  .top a{color:var(--ink);text-decoration:none;font-size:.9rem;opacity:.7;padding:.5rem .2rem;margin-right:auto}
  .tog{width:3rem;height:3rem;border-radius:50%;border:2px solid var(--ink);background:transparent;font:600 1.15rem system-ui,sans-serif;color:var(--ink);display:grid;place-items:center;padding:0}
  .tog[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
  .tog svg{width:1.5rem;height:1.5rem}
  #countbox{text-align:center;height:6.2rem;display:flex;flex-direction:column;justify-content:center}
  #count{font:700 4.6rem/1 ui-rounded,"SF Pro Rounded",system-ui,sans-serif;font-variant-numeric:tabular-nums;transition:transform .25s}
  #count.zero{opacity:.18}
  #count.pop{transform:scale(1.18)}
  #knword{font-size:1.25rem;min-height:1.5rem;opacity:.8}
  #stage{flex:1;min-height:0;display:flex;justify-content:center}
  svg#m{height:100%;width:100%;max-width:100%;touch-action:none;user-select:none;-webkit-user-select:none}
  #again{margin-top:.6rem;font:600 1.3rem system-ui,sans-serif;border:0;border-radius:999px;padding:1.05rem;background:var(--ink);color:var(--paper);box-shadow:0 5px 0 #000a;width:100%}
  #again:active{transform:translateY(3px);box-shadow:0 2px 0 #000a}
  .hit{cursor:pointer}
  @keyframes pulse{0%,100%{opacity:.0;transform:scale(.92)}50%{opacity:.55;transform:scale(1.08)}}
  .ring{fill:none;stroke:var(--ink);stroke-width:2;stroke-dasharray:4 6;transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-in-out infinite;display:none}
  .ring.on{display:inline}
  #xray{display:none}
  .see #xray{display:inline}
  .see #rface{fill-opacity:.22}
  .see #rhatch{opacity:0}
</style>
</head>
<body>
<main>
  <div class="top">
    <a href="./today.html">&larr; Today</a>
    <button class="tog" id="seeBtn" aria-pressed="false" aria-label="See inside">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <button class="tog" id="knBtn" aria-pressed="false" aria-label="Also say it in Kannada">ಕ</button>
  </div>
  <div id="countbox"><div id="count" class="zero">0</div><div id="knword"></div></div>
  <div id="stage">
<svg id="m" viewBox="0 30 400 575" xmlns="http://www.w3.org/2000/svg" aria-label="Gumball machine">
  <defs>
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#2a1f1a" stroke-width="1.1" opacity=".35"/>
    </pattern>
    <clipPath id="globeClip"><circle cx="200" cy="167" r="97"/></clipPath>
    <radialGradient id="glass" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset=".6" stop-color="#eaf6f0" stop-opacity=".55"/>
      <stop offset="1" stop-color="#cfe9de" stop-opacity=".7"/>
    </radialGradient>
  </defs>
  <g id="machine" filter="url(#ink)" stroke="#2a1f1a" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- shadow -->
    <ellipse cx="200" cy="478" rx="150" ry="26" fill="#2a1f1a" opacity=".08" stroke="none"/>
    <!-- base: top, left, right faces (filled by JS paths) -->
    <path id="lface" fill="#c8431f"/>
    <path id="lhatch" fill="url(#hatch)" stroke="none"/>
    <path id="rface" fill="#e4572e"/>
    <path id="rhatch" fill="url(#hatch)" stroke="none" opacity=".35"/>
    <!-- inside view (right face plane) -->
    <g id="xray" transform="matrix(0.866,-0.5,0,1,200,340)">
      <rect x="58" y="-4" width="24" height="44" fill="#fff" fill-opacity=".6" stroke-width="2"/>
      <circle cx="70" cy="18" r="9.5" fill="#8fd1b5" stroke-width="2"/>
      <g id="wheel" transform="translate(70 70)">
        <circle r="34" fill="#f6efe0" stroke-width="2.2"/>
        <g id="pockets"></g>
        <circle r="5" fill="#2a1f1a" stroke="none"/>
      </g>
      <path d="M58 104 L58 112 Q70 120 82 112 L82 104" fill="none" stroke-width="2"/>
      <!-- coin path & latch -->
      <path d="M118 20 L118 52 Q118 60 110 62 L104 63" fill="none" stroke-width="2" stroke-dasharray="3 4"/>
      <circle id="xcoin" cx="108" cy="62" r="8" fill="#e8b23a" stroke-width="2" opacity="0"/>
      <rect id="latch" x="98" y="55" width="12" height="5" rx="2" fill="#2a1f1a" stroke="none"/>
    </g>
    <path id="tface" fill="#ef7b56"/>
    <!-- collar -->
    <g id="collar"></g>
    <!-- globe -->
    <circle cx="200" cy="167" r="100" fill="url(#glass)"/>
    <g id="balls" clip-path="url(#globeClip)" stroke-width="2"></g>
    <path d="M132 120 Q150 88 186 78" fill="none" stroke="#fff" stroke-width="7" opacity=".85"/>
    <path d="M128 140 Q127 133 129 128" fill="none" stroke="#fff" stroke-width="5" opacity=".85"/>
    <circle cx="200" cy="167" r="100" fill="none"/>
    <g id="collarFront"></g>
    <!-- cap -->
    <g id="cap"></g>
    <!-- right-face hardware -->
    <g transform="matrix(0.866,-0.5,0,1,200,340)">
      <rect x="46" y="6" width="48" height="30" rx="6" fill="#e8b23a"/>
      <rect x="66" y="11" width="8" height="20" rx="3" fill="#2a1f1a"/>
      <!-- chute -->
      <path d="M48 128 L48 106 Q70 88 92 106 L92 128 Z" fill="#2a1f1a"/>
      <path id="flap" d="M50 106 Q70 92 90 106 L90 118 Q70 106 50 118 Z" fill="#e8b23a" stroke-width="2"/>
    </g>
    <!-- crank (own group so it can turn) -->
    <g transform="matrix(0.866,-0.5,0,1,200,340)">
      <circle cx="70" cy="70" r="28" fill="#e8b23a"/>
      <g id="crank" transform="translate(70 70) rotate(0)">
        <rect x="-6" y="-27" width="12" height="54" rx="6" fill="#2f5bb7"/>
        <circle cx="0" cy="-27" r="10" fill="#f2a7a0"/>
        <circle cx="0" cy="0" r="6" fill="#fbf4e6"/>
      </g>
      <circle id="crankRing" class="ring" cx="70" cy="70" r="36"/>
      <circle id="crankHit" class="hit" cx="70" cy="70" r="40" fill="transparent" stroke="none"/>
    </g>
    <!-- tray -->
    <g id="tray"></g>
  </g>
  <!-- ten frames -->
  <g id="frames" stroke="#2a1f1a" stroke-width="2.4" filter="url(#ink)"></g>
  <g id="fly" stroke="#2a1f1a" stroke-width="2.2"></g>
  <!-- coin -->
  <g id="coinG" class="hit">
    <circle id="coinRing" class="ring on" cx="0" cy="0" r="40"/>
    <g id="coin" filter="url(#ink)" stroke="#2a1f1a" stroke-width="2.6">
      <circle r="30" fill="#e8b23a"/>
      <circle r="21" fill="none" stroke-width="1.8" opacity=".7"/>
      <path d="M-9 -12 Q-14 0 -9 12" fill="none" stroke="#fff" stroke-width="4" opacity=".7"/>
    </g>
    <circle r="44" fill="transparent"/>
  </g>
</svg>
  </div>
  <button id="again" type="button">Start over</button>
</main>

const $ = id => document.getElementById(id);
const C30 = 0.866, S30 = 0.5;
const iso = (x,y,z) => [200 + (x - y) * C30, 400 + (x + y) * S30 - z];
const P = pts => "M" + pts.map(p => p.map(v => v.toFixed(1)).join(" ")).join(" L") + " Z";
function el(tag, attrs, parent){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; }

// ---- base box ----
const W = 70, H = 130;
$("tface").setAttribute("d", P([iso(-W,-W,H), iso(W,-W,H), iso(W,W,H), iso(-W,W,H)]));
const L = P([iso(-W,W,H), iso(W,W,H), iso(W,W,0), iso(-W,W,0)]);
$("lface").setAttribute("d", L); $("lhatch").setAttribute("d", L);
const R = P([iso(W,W,H), iso(W,-W,H), iso(W,-W,0), iso(W,W,0)]);
$("rface").setAttribute("d", R); $("rhatch").setAttribute("d", R);

// ---- iso cylinder helper (vertical axis) ----
function cylinder(g, cx, cyTop, r, h, fill, topFill, backOnly){
  const rx = r * 1.2247, ry = r * 0.7071, yb = cyTop + h;
  el("path", {d:`M${cx-rx} ${cyTop} L${cx-rx} ${yb} A${rx} ${ry} 0 0 0 ${cx+rx} ${yb} L${cx+rx} ${cyTop}`, fill}, g);
  el("ellipse", {cx, cy:cyTop, rx, ry, fill: topFill}, g);
}

(function(){ const r=13, cx=200, cy=167, R0=97-r; const rows=[];
  for (let row=0; row<20; row++){ const y = cy + R0 - row*r*1.75; if (y < cy-R0) break;
    const half = Math.sqrt(Math.max(0, R0*R0-(y-cy)*(y-cy)));
    const off = row%2 ? r : 0;
    for (let x = cx - half + off; x <= cx + half + .01; x += 2*r) slots.push([x, y]); }
  slots.sort((a,b)=> b[1]-a[1] || Math.abs(a[0]-200)-Math.abs(b[0]-200));
})();
let globe = [];
function fillGlobe(){ $("balls").innerHTML=""; globe = [];
  for (let k=0;k<MAX+6 && k<slots.length;k++){ const [x,y]=slots[k];
    globe.push(el("circle",{cx:(x+ (k*7%5-2)).toFixed(1), cy:y.toFixed(1), r:13, fill:COLORS[(k*3+1)%5]}, $("balls"))); }
}

// ---- ten frames ----
const CELL = 28, FY = 518, FX = [52, 208];
const cells = [];
(function(){ const g=$("frames");
  FX.forEach(fx => { el("rect",{x:fx, y:FY, width:CELL*5, height:CELL*2, rx:6, fill:"#fffaf1"}, g);
    for (let i=1;i<5;i++) el("line",{x1:fx+i*CELL, y1:FY, x2:fx+i*CELL, y2:FY+CELL*2, "stroke-width":1.6}, g);
    el("line",{x1:fx, y1:FY+CELL, x2:fx+CELL*5, y2:FY+CELL, "stroke-width":1.6}, g);
    for (let r=0;r<2;r++) for (let c=0;c<5;c++) cells.push([fx+c*CELL+CELL/2, FY+r*CELL+CELL/2]); });
})();

// ---- coin ----
const COIN_HOME = [62, 452];
function placeCoin(x,y,s=1,sx=1){ $("coinG").setAttribute("transform",`translate(${x} ${y}) scale(${s*sx} ${s})`); }

// ---- tween ----
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
function tween(ms, fn){ return new Promise(res => { const t0=performance.now();
  (function f(now){ const t=Math.min(1,(now-t0)/ms); fn(t); if (t<1) requestAnimationFrame(f); else res(); })(t0); }); }
const wait = ms => new Promise(r=>setTimeout(r,ms));

// ---- sound ----
let actx;
function tick(freq=520, dur=.06, vol=.08){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(), g=actx.createGain(); o.type="triangle"; o.frequency.value=freq;
  g.gain.setValueAtTime(vol, actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+dur);
  o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+dur); }catch(e){} }
let voices = [];
function loadVoices(){ voices = (window.speechSynthesis && speechSynthesis.getVoices()) || []; }
if (window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
const pick = pre => voices.find(v => v.lang && v.lang.toLowerCase().replace("_","-").startsWith(pre));
function sayKn(n){
  const v = pick("kn");
  if (v && window.speechSynthesis){ const u=new SpeechSynthesisUtterance(KN[n]); u.voice=v; u.lang=v.lang; u.rate=.85; speechSynthesis.speak(u); return; }
  if (KN_AUDIO[n]){ const a=new Audio(KN_AUDIO[n]); a.play().catch(()=>{}); }
}
function say(n){
  const kn = knOn;
  if (!window.speechSynthesis){ if (kn) sayKn(n); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(n));
  const v = pick("en-in") || pick("en-us") || pick("en"); if (v) u.voice = v;
  u.lang = v ? v.lang : "en-US"; u.rate = .85; u.pitch = 1.05;
  if (kn){ let done=false; const next=()=>{ if(!done){done=true; setTimeout(()=>sayKn(n),250);} }; u.onend=next; u.onerror=next; setTimeout(next, 2200); }
  speechSynthesis.speak(u);
}

// ---- state ----
let count = 0, paid = false, busy = false, crankAngle = 0, wheelAngle = 0, knOn = false;
const flying = [];
function setCount(n){ count=n; const c=$("count"); c.textContent=n; c.classList.toggle("zero", n===0);
  $("knword").textContent = knOn && n ? KN[n] : "";
  if (n){ c.classList.add("pop"); setTimeout(()=>c.classList.remove("pop"), 260); } }
function setCrank(a){ crankAngle=a; $("crank").setAttribute("transform",`translate(70 70) rotate(${a})`); }
function setWheel(a){ $("wheel").setAttribute("transform",`translate(70 70) rotate(${a})`); }
function hints(){ $("coinRing").classList.toggle("on", !paid && !busy && count<MAX);
  $("crankRing").classList.toggle("on", paid && !busy); }

async function insertCoin(){
  if (busy || paid || count>=MAX) return; busy=true; hints(); tick(700,.05,.06);
  const [x0,y0]=COIN_HOME, [x1,y1]=SLOT;
  await tween(650, t => { const e=ease(t); const x=x0+(x1-x0)*e, y=y0+(y1-y0)*e - Math.sin(Math.PI*e)*120;
    placeCoin(x,y, 1-.55*e, 1); });
  await tween(260, t => placeCoin(x1, y1 + 6*t, .45, Math.max(.05,1-t)));
  $("coinG").style.display="none"; tick(330,.09,.1);
  $("xcoin").setAttribute("opacity","1"); $("latch").setAttribute("opacity",".25");
  paid=true; busy=false; hints();
}
function wiggle(){ if (busy) return; busy=true;
  tween(420, t => setCrank(Math.sin(t*Math.PI*3)*14*(1-t))).then(()=>{ setCrank(0); busy=false; hints(); }); }

async function dispense(fromAngle){
  busy=true; paid=false; hints();
  const start = fromAngle || 0;
  await tween(Math.max(250, 800*(1-start/360)), t => { const a = start + (360-start)*ease(t); setCrank(a); setWheel(wheelAngle + 60*(a/360)); if (t>.5 && t<.53) tick(260,.05,.07); });
  wheelAngle += 60; setCrank(0); setWheel(wheelAngle);
  $("xcoin").setAttribute("opacity","0"); $("latch").setAttribute("opacity","1");
  // remove top globe ball
  const top = globe.pop(); if (top) tween(220, t => top.setAttribute("opacity", 1-t)).then(()=>top.remove());
  const color = top ? top.getAttribute("fill") : COLORS[count%5];
  // flap swings, ball pops out to tray
  const ball = el("circle",{cx:CHUTE[0], cy:CHUTE[1]-6, r:12, fill:color}, $("fly")); flying.push(ball);
  $("flap").style.opacity=".25";
  await tween(380, t => { const e=ease(t); ball.setAttribute("cx", CHUTE[0]+(TRAY[0]-CHUTE[0])*e); ball.setAttribute("cy", CHUTE[1]-6+(TRAY[1]-CHUTE[1]+6)*e - Math.sin(Math.PI*t)*10); });
  $("flap").style.opacity="1"; tick(420,.05,.06);
  await wait(180);
  const [cx,cy]=cells[count];
  await tween(620, t => { const e=ease(t); ball.setAttribute("cx", TRAY[0]+(cx-TRAY[0])*e); ball.setAttribute("cy", TRAY[1]+(cy-TRAY[1])*e - Math.sin(Math.PI*e)*70); });
  tick(600,.07,.08);
  setCount(count+1); say(count);
  if (count < MAX){ placeCoin(...COIN_HOME, .2); $("coinG").style.display="";
    await tween(260, t => placeCoin(...COIN_HOME, .2+.8*ease(t))); }
  busy=false; hints();
}

// coin tap
$("coinG").addEventListener("pointerdown", e => { e.preventDefault(); insertCoin(); });
// crank: tap or drag
let drag=null;
const svg=$("m");
function screenAngle(e){ const pt=svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
  const p=pt.matrixTransform(svg.getScreenCTM().inverse()); const c=face(70,70);
  return Math.atan2(p.y-c[1], p.x-c[0])*180/Math.PI; }
$("crankHit").addEventListener("pointerdown", e => { e.preventDefault();
  if (busy) return; if (!paid){ wiggle(); if (count<MAX) { const r=$("coinRing"); r.classList.remove("on"); void r.getBBox(); r.classList.add("on"); } return; }
  drag={last:screenAngle(e), total:0, moved:false}; try{ $("crankHit").setPointerCapture(e.pointerId); }catch(_){} });
$("crankHit").addEventListener("pointermove", e => { if(!drag) return;
  let a=screenAngle(e), d=a-drag.last; if (d>180) d-=360; if (d<-180) d+=360; drag.last=a;
  drag.total=Math.max(0, Math.min(359, drag.total+d)); if (drag.total>12) drag.moved=true;
  setCrank(drag.total); setWheel(wheelAngle+60*drag.total/360);
  if (drag.total>=300){ const t=drag.total; drag=null; dispense(t); } });
function endDrag(){ if(!drag) return; const t=drag.total; drag=null; dispense(t > 12 ? t : 0); }
$("crankHit").addEventListener("pointerup", endDrag);
$("crankHit").addEventListener("pointercancel", endDrag);

// toggles
function setSee(on){ document.body.classList.toggle("see", on); $("m").classList.toggle("see", on); $("seeBtn").setAttribute("aria-pressed", on); try{localStorage.gbSee=on?"1":"";}catch(_){} }
function setKn(on){ knOn=on; $("knBtn").setAttribute("aria-pressed", on); $("knword").textContent = on && count ? KN[count] : ""; try{localStorage.gbKn=on?"1":"";}catch(_){} }
$("seeBtn").onclick = () => setSee(!document.body.classList.contains("see"));
$("knBtn").onclick = () => setKn(!knOn);
try{ setSee(localStorage.gbSee==="1"); setKn(localStorage.gbKn==="1"); }catch(_){}

function reset(){ if (window.speechSynthesis) speechSynthesis.cancel();
  flying.splice(0).forEach(b=>b.remove()); fillGlobe(); paid=false; busy=false;
  setCrank(0); wheelAngle=0; setWheel(0); $("xcoin").setAttribute("opacity","0"); $("latch").setAttribute("opacity","1");
  $("coinG").style.display=""; placeCoin(...COIN_HOME); setCount(0); hints(); }
$("again").onclick = reset;
reset();
// test hook for scripted checks
window.__gb = { get count(){return count;}, get busy(){return busy;}, get paid(){return paid;} };
</script>
