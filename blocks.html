:root{
  --paper:#f3e6d0;
  --ink:#2a2218;
  --muted:#7a6a58;
  --edge:#8d5a3c;
  --leaf:#3f6b45;
  --ease:cubic-bezier(0.23,1,0.32,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  min-height:100dvh;
  color:var(--ink);
  font-family:ui-rounded,"Avenir Next Rounded","Hiragino Maru Gothic ProN",system-ui,sans-serif;
  background:
    radial-gradient(ellipse at 50% 108%,rgba(166,112,64,.2),transparent 46%),
    var(--paper);
  user-select:none;-webkit-user-select:none;
  overscroll-behavior:none;
}
.app{
  height:100dvh;
  display:flex;
  flex-direction:column;
  padding:
    max(6px,env(safe-area-inset-top))
    max(10px,env(safe-area-inset-right))
    max(8px,env(safe-area-inset-bottom))
    max(10px,env(safe-area-inset-left));
}
.bar{
  display:grid;
  grid-template-columns:48px minmax(0,1fr) 48px;
  align-items:center;
  flex:none;
}
.chev{
  width:48px;height:48px;
  border:0;background:transparent;
  color:var(--edge);
  font-size:2rem;line-height:1;
  border-radius:16px;
  padding:0;
  transition:transform 140ms var(--ease);
}
.chev:active{transform:scale(0.97)}
.chev.is-off{visibility:hidden}
.lock{text-align:center;min-width:0}
.numeral{
  margin:0;
  font-size:clamp(3.1rem,13vw,4.8rem);
  line-height:.84;
  letter-spacing:-.045em;
  font-weight:800;
  font-variant-numeric:tabular-nums;
}
.kannada{
  margin:2px 0 0;
  min-height:1.45em;
  font-family:"Blocks Kannada","Noto Sans Kannada","Kannada MN",sans-serif;
  font-size:clamp(1.35rem,5.4vw,1.8rem);
  line-height:1.45;
  color:var(--edge);
}
.said{
  margin:2px 0 0;
  min-height:1.35em;
  font-weight:800;
  font-size:1.02rem;
  font-family:ui-rounded,"Blocks Kannada","Noto Sans Kannada",sans-serif;
  font-variant-numeric:tabular-nums;
}
#stage{
  flex:1;
  min-height:0;
  display:flex;
  position:relative;
  overflow:hidden;
}
#screen-number,#screen-together{
  flex:1;
  min-height:0;
  width:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
}
#screen-together{justify-content:center;gap:6px}
.tower{
  display:flex;
  flex-direction:column-reverse;
  align-items:center;
  justify-content:flex-start;
  gap:6px;
  padding-bottom:2px;
}
.tower.row{
  flex-direction:row;
  align-items:flex-end;
  justify-content:center;
  width:100%;
}
.cube{
  border:0;padding:0;
  border-radius:22px;
  color:#6a3b24;
  display:grid;place-items:center;
  flex:none;
  background:
    linear-gradient(180deg,rgba(255,255,255,.62),transparent 34%),
    linear-gradient(#f2d2b2,#c48962 56%,#b0734c);
  box-shadow:
    inset 0 -9px 0 rgba(110,58,28,.15),
    inset 0 1px 0 rgba(255,255,255,.7),
    0 8px 14px rgba(80,40,10,.1);
  transition:color 160ms ease;
  touch-action:manipulation;
}
.cube.counted{
  color:var(--leaf);
  box-shadow:
    inset 0 0 0 3px var(--leaf),
    inset 0 -9px 0 rgba(110,58,28,.12),
    0 8px 14px rgba(80,40,10,.1);
}
.cube:active{transform:scale(0.97)}
.seed{width:46%;height:46%;display:block}
.ghost{
  flex:none;
  width:64px;height:64px;
  display:grid;place-items:center;
  border-radius:18px;
  border:2px dashed rgba(141,90,60,.5);
  background:transparent;
  color:var(--edge);
  font:inherit;
  font-weight:800;
  font-size:1.6rem;
  padding:0;
  min-width:48px;min-height:48px;
  touch-action:manipulation;
  transition:transform 140ms var(--ease);
}
.ghost:active{transform:scale(0.97)}
.world{
  flex:none;
  margin:0;
  padding:8px 16px 2px;
  text-align:center;
  color:var(--muted);
  font-size:.98rem;
  line-height:1.3;
  overflow-wrap:anywhere;
  background:var(--paper);
  position:relative;
  z-index:2;
}
.fact{width:min(100%,440px);padding:2px 0}
.fact-num{
  margin:0;
  text-align:center;
  font-size:1.85rem;
  font-weight:800;
  letter-spacing:-.04em;
  line-height:1;
  font-variant-numeric:tabular-nums;
}
.piles{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin-top:6px}
.pile{
  min-width:76px;min-height:64px;
  padding:4px 6px 0;
  border:0;border-radius:18px;
  background:transparent;
  touch-action:manipulation;
  transition:transform 140ms var(--ease);
}
.pile:active{transform:scale(0.97)}
.stack{display:flex;flex-direction:column-reverse;align-items:center;gap:5px}
.pile .cube{width:68px;height:58px;border-radius:16px;pointer-events:none;box-shadow:inset 0 -6px 0 rgba(110,58,28,.14),inset 0 1px 0 rgba(255,255,255,.65),0 6px 10px rgba(80,40,10,.1)}
.and{font-weight:800;color:var(--muted);align-self:center}
.fact-line{margin:6px 0 0;text-align:center;font-weight:800;min-height:1.25em;font-variant-numeric:tabular-nums}
html.land .numeral{font-size:2.4rem}
html.land .kannada{font-size:1.15rem;min-height:1.2em}
html.land .said{font-size:.9rem}
html.land .world{font-size:.85rem;padding-top:2px}
html.land #screen-together{flex-direction:row;align-items:flex-end;justify-content:center;gap:8px}
html.land .pile .cube{width:52px;height:44px}
@media (hover:hover) and (pointer:fine){
  .chev:hover,.ghost:hover{color:var(--ink)}
}
@media (prefers-reduced-motion:reduce){
  .chev,.ghost,.pile,.cube{transition:none}
  .chev:active,.ghost:active,.pile:active,.cube:active{transform:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <button class="chev" id="back" type="button" aria-label="Back">‹</button>
    <div class="lock">
      <h1 class="numeral" id="numeral">1</h1>
      <p class="kannada" id="kannada" lang="kn">ಒಂದು</p>
      <p class="said" id="said" aria-live="polite"></p>
    </div>
    <button class="chev" id="next" type="button" aria-label="Next">›</button>
  </header>
  <div id="stage"></div>
  <p class="world" id="world-text">Hold up 1 finger.</p>
</div>
<script>
/* Clay blocks. One carved seed on every block, earth clay, no names.
   Original to this page. Do not import television number-character
   names, rainbow colours, songs, or faces. */
(function () {
  'use strict';
  var EASE = 'cubic-bezier(0.23, 1, 0.32, 1)';
  var NUMBERS = [
    { n: 1, en: 'one', kn: 'ಒಂದು', world: 'Hold up 1 finger.' },
    { n: 2, en: 'two', kn: 'ಎರಡು', world: 'Find 2 shoes.' },
    { n: 3, en: 'three', kn: 'ಮೂರು', world: 'Build 3 with your blocks.' },
    { n: 4, en: 'four', kn: 'ನಾಲ್ಕು', world: 'Find 4 spoons.' },
    { n: 5, en: 'five', kn: 'ಐದು', world: 'Clap 5 times.' }
  ];
  var SIX = { en: 'six' };
  var index = 0;
  var six = false;
  var line = '';
  var joined = { 4: false, 5: false };
  var factLine = { 4: '2 and 2', 5: '3 and 2' };
  var pendingKn = '';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var stage = document.getElementById('stage');
  var backBtn = document.getElementById('back');
  var nextBtn = document.getElementById('next');
  var numeral = document.getElementById('numeral');
  var kannada = document.getElementById('kannada');
  var said = document.getElementById('said');
  var world = document.getElementById('world-text');

  function landscape() {
    return window.innerHeight < 520 && window.innerWidth > window.innerHeight;
  }
  function knVoice() {
    var synth = window.speechSynthesis;
    if (!synth || !synth.getVoices) return null;
    var list = [];
    try { list = synth.getVoices() || []; } catch (e) { return null; }
    for (var i = 0; i < list.length; i++) {
      if (String(list[i].lang || '').toLowerCase().indexOf('kn') === 0) return list[i];
    }
    return null;
  }
  function speakKn(kn, voice) {
    var synth = window.speechSynthesis;
    if (!synth) return;
    try {
      var k = new SpeechSynthesisUtterance(kn);
      k.lang = voice.lang || 'kn-IN';
      k.rate = 0.85;
      try { k.voice = voice; } catch (e) {}
      synth.speak(k);
    } catch (e2) {}
  }
  function say(en, kn) {
    var synth = window.speechSynthesis;
    if (!synth || !en) return;
    try { synth.cancel(); } catch (e) {}
    try {
      var u = new SpeechSynthesisUtterance(en);
      u.lang = 'en-US';
      u.rate = 0.9;
      synth.speak(u);
    } catch (e3) {}
    pendingKn = kn || '';
    if (!kn) return;
    var voice = knVoice();
    if (!voice) return;
    pendingKn = '';
    speakKn(kn, voice);
  }
  function wordFor(count) {
    if (count >= 1 && count <= 5) return NUMBERS[count - 1];
    if (count === 6) return SIX;
    return null;
  }
  function seed() {
    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', 'seed');
    svg.setAttribute('viewBox', '0 0 48 48');
    svg.setAttribute('aria-hidden', 'true');
    function dot(cx) {
      var c = document.createElementNS(ns, 'circle');
      c.setAttribute('cx', String(cx));
      c.setAttribute('cy', '20');
      c.setAttribute('r', '2.15');
      c.setAttribute('fill', 'currentColor');
      return c;
    }
    var path = document.createElementNS(ns, 'path');
    path.setAttribute('d', 'M16 30.5c3.4 3.2 12.6 3.2 16 0');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'currentColor');
    path.setAttribute('stroke-width', '2.2');
    path.setAttribute('stroke-linecap', 'round');
    svg.appendChild(dot(17));
    svg.appendChild(dot(31));
    svg.appendChild(path);
    return svg;
  }
  function makeCube(i) {
    var el = document.createElement('button');
    el.type = 'button';
    el.className = 'cube';
    el.setAttribute('data-i', String(i));
    el.setAttribute('aria-label', 'Block');
    el.appendChild(seed());
    return el;
  }
  function pop(el) {
    if (reduce || !el.animate) return;
    el.getAnimations().forEach(function (a) { a.cancel(); });
    el.animate([
      { transform: 'scale(0.96)' },
      { transform: 'scale(1.035)', offset: 0.42 },
      { transform: 'scale(1)' }
    ], { duration: 260, easing: EASE });
  }
  function snapshot() {
    return Array.prototype.map.call(stage.querySelectorAll('#blocks .cube'), function (el) {
      return { i: el.getAttribute('data-i'), box: el.getBoundingClientRect() };
    });
  }
  function playFlip(prev) {
    if (reduce || !prev.length) return;
    var map = {};
    prev.forEach(function (p) { map[p.i] = p.box; });
    Array.prototype.forEach.call(stage.querySelectorAll('#blocks .cube'), function (el) {
      var old = map[el.getAttribute('data-i')];
      var box = el.getBoundingClientRect();
      if (!old || !box.width) {
        el.animate([
          { transform: 'translateY(14px) scale(0.96)', opacity: 0 },
          { transform: 'none', opacity: 1 }
        ], { duration: 240, easing: EASE });
        return;
      }
      var dx = (old.left + old.width / 2) - (box.left + box.width / 2);
      var dy = (old.top + old.height / 2) - (box.top + box.height / 2);
      var s = old.width / box.width;
      if (!isFinite(s) || s <= 0) s = 1;
      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5 && Math.abs(s - 1) < 0.02) return;
      el.animate([
        { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ')' },
        { transform: 'translate(0,0) scale(1)' }
      ], { duration: 260, easing: EASE });
    });
  }
  function applySize() {
    document.documentElement.classList.toggle('land', landscape());
    var screen = document.getElementById('screen-number');
    var blocks = document.getElementById('blocks');
    if (!screen || !blocks) return;
    var cubes = blocks.querySelectorAll('.cube');
    var n = cubes.length || 1;
    var gap = 6;
    var ghostEl = document.getElementById('add-one');
    var land = landscape();
    if (land) {
      blocks.classList.add('row');
      var gh = 64;
      var h = Math.max(56, Math.min(screen.clientHeight - 20, 128));
      var availW = Math.max(48, screen.clientWidth - 12 - gh - gap * n);
      var w = Math.max(48, Math.min(Math.floor(availW / n), h));
      Array.prototype.forEach.call(cubes, function (el) {
        el.style.width = w + 'px';
        el.style.height = w + 'px';
      });
      if (ghostEl) {
        var g = Math.max(48, Math.min(64, w));
        ghostEl.style.width = g + 'px';
        ghostEl.style.height = g + 'px';
      }
      return;
    }
    blocks.classList.remove('row');
    var ghostH = 64;
    var avail = screen.clientHeight - ghostH - gap * (n + 1) - 8;
    var side = Math.floor(avail / n);
    var maxW = Math.min(screen.clientWidth - 28, 210);
    if (!isFinite(side) || side < 56) side = 56;
    if (side > maxW) side = maxW;
    if (side * n > avail && avail > 0) side = Math.max(48, Math.floor(avail / n));
    var bw = Math.min(Math.round(side * 1.15), maxW);
    Array.prototype.forEach.call(cubes, function (el) {
      el.style.width = bw + 'px';
      el.style.height = side + 'px';
    });
    if (ghostEl) {
      ghostEl.style.width = '64px';
      ghostEl.style.height = '64px';
    }
  }
  function pile(count) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pile';
    btn.setAttribute('aria-label', count + (count === 1 ? ' block' : ' blocks'));
    var stack = document.createElement('span');
    stack.className = 'stack';
    for (var i = 0; i < count; i++) {
      var c = document.createElement('span');
      c.className = 'cube';
      c.appendChild(seed());
      stack.appendChild(c);
    }
    btn.appendChild(stack);
    return btn;
  }
  function renderFact(total, parts) {
    var section = document.createElement('section');
    section.className = 'fact';
    section.id = 'fact-' + total;
    section.setAttribute('data-total', String(total));
    section.setAttribute('data-joined', joined[total] ? 'true' : 'false');
    var num = document.createElement('p');
    num.className = 'fact-num';
    num.textContent = String(total);
    section.appendChild(num);
    var piles = document.createElement('div');
    piles.className = 'piles';
    if (joined[total]) {
      piles.appendChild(pile(total));
    } else {
      piles.appendChild(pile(parts[0]));
      var and = document.createElement('span');
      and.className = 'and';
      and.textContent = 'and';
      piles.appendChild(and);
      piles.appendChild(pile(parts[1]));
    }
    section.appendChild(piles);
    var lineEl = document.createElement('p');
    lineEl.className = 'fact-line';
    lineEl.setAttribute('aria-live', 'polite');
    lineEl.textContent = factLine[total];
    section.appendChild(lineEl);
    return section;
  }
  function render(motion) {
    var prev = motion ? snapshot() : [];
    var info = NUMBERS[Math.min(index, 4)];
    var show = six ? 6 : info.n;
    document.documentElement.classList.toggle('land', landscape());
    backBtn.classList.toggle('is-off', index === 0);
    backBtn.disabled = index === 0;
    if (index === 0) backBtn.setAttribute('aria-hidden', 'true');
    else backBtn.removeAttribute('aria-hidden');
    nextBtn.textContent = index === 5 ? '↻' : '›';
    nextBtn.setAttribute('aria-label', index === 5 ? 'Again' : 'Next');
    stage.textContent = '';
    if (index < 5) {
      numeral.textContent = String(show);
      kannada.textContent = six ? '' : info.kn;
      said.textContent = line;
      world.textContent = six ? 'Six is for another day.' : info.world;
      var screen = document.createElement('div');
      screen.id = 'screen-number';
      screen.setAttribute('data-n', String(show));
      var blocks = document.createElement('div');
      blocks.id = 'blocks';
      blocks.className = 'tower';
      for (var i = 0; i < show; i++) blocks.appendChild(makeCube(i));
      var ghost = document.createElement('button');
      ghost.type = 'button';
      ghost.className = 'ghost';
      ghost.id = 'add-one';
      if (six) {
        ghost.textContent = '5';
        ghost.setAttribute('aria-label', 'Back to 5');
      } else {
        ghost.textContent = '+';
        ghost.setAttribute('aria-label', 'Add one');
      }
      blocks.appendChild(ghost);
      screen.appendChild(blocks);
      stage.appendChild(screen);
      applySize();
      if (motion) playFlip(prev);
    } else {
      numeral.textContent = '';
      kannada.textContent = '';
      said.textContent = '';
      world.textContent = 'Tap to join. Tap to split.';
      var together = document.createElement('div');
      together.id = 'screen-together';
      together.appendChild(renderFact(4, [2, 2]));
      together.appendChild(renderFact(5, [3, 2]));
      stage.appendChild(together);
    }
  }
  function onBlock(btn) {
    var n = btn.getAttribute('data-count');
    if (!n) {
      n = String(document.querySelectorAll('#blocks .cube[data-count]').length + 1);
      btn.setAttribute('data-count', n);
      btn.classList.add('counted');
      btn.setAttribute('aria-label', 'Block ' + n);
    }
    pop(btn);
    var info = wordFor(Number(n));
    if (!info) return;
    said.textContent = info.kn ? (info.en + ' · ' + info.kn) : info.en;
    say(info.en, info.kn || '');
  }
  function onAdd() {
    if (six) {
      six = false;
      line = '';
      render(false);
      return;
    }
    var info = NUMBERS[index];
    line = info.n + ' and 1 make ' + (info.n + 1);
    if (info.n < 5) index += 1;
    else six = true;
    render(true);
    say(line, '');
  }
  function toggleFact(total, parts) {
    if (joined[total]) {
      joined[total] = false;
      line = total + ' is ' + parts[0] + ' and ' + parts[1];
    } else {
      joined[total] = true;
      line = parts[0] + ' and ' + parts[1] + ' make ' + total;
    }
    factLine[total] = line;
    render(false);
    var pileEl = document.querySelector('#fact-' + total + ' .pile');
    if (pileEl) pop(pileEl);
    say(line, '');
  }
  function onNext() {
    line = '';
    six = false;
    if (index < 5) index += 1;
    else {
      index = 0;
      joined[4] = false;
      joined[5] = false;
      factLine[4] = '2 and 2';
      factLine[5] = '3 and 2';
    }
    render(false);
  }
  stage.addEventListener('click', function (e) {
    if (e.target.closest('#add-one')) { onAdd(); return; }
    var pileBtn = e.target.closest('.pile');
    if (pileBtn) {
      var fact = pileBtn.closest('.fact');
      var total = Number(fact.getAttribute('data-total'));
      toggleFact(total, total === 4 ? [2, 2] : [3, 2]);
      return;
    }
    if (index >= 5) return;
    var cube = e.target.closest('#blocks .cube');
    if (!cube) cube = document.querySelector('#blocks .cube:not(.counted)');
    if (cube) onBlock(cube);
  });
  backBtn.addEventListener('click', function () {
    if (index === 0) return;
    line = '';
    if (index === 4 && six) { six = false; render(false); return; }
    six = false;
    index -= 1;
    render(false);
  });
  nextBtn.addEventListener('click', onNext);
  window.addEventListener('resize', function () { applySize(); });
  if (window.speechSynthesis && speechSynthesis.getVoices) {
    try { speechSynthesis.getVoices(); } catch (e) {}
    speechSynthesis.addEventListener('voiceschanged', function () {
      try { speechSynthesis.getVoices(); } catch (e) {}
      if (!pendingKn) return;
      var voice = knVoice();
      if (!voice) return;
      var word = pendingKn;
      pendingKn = '';
      speakKn(word, voice);
    });
  }
  render(false);
})();
</script>
</body>
</html>
