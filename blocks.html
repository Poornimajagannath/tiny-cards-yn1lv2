:root{
  --paper:#f3e6d0;
  --card:#fbf6eb;
  --ink:#2a2218;
  --muted:#7a6a58;
  --clay:#c48962;
  --clay-deep:#6b442c;
  --edge:#8d5a3c;
  --leaf:#6a8a5c;
  --line:rgba(141,98,68,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--paper)}
html,body{margin:0;color:var(--ink)}
body{
  min-height:100vh;
  min-height:100dvh;
  font-family:ui-rounded,"Avenir Next Rounded","Hiragino Maru Gothic ProN",system-ui,-apple-system,sans-serif;
  background-color:var(--paper);
  background-image:
    radial-gradient(ellipse at 8% 0%,rgba(196,160,86,.18),transparent 48%),
    repeating-linear-gradient(to bottom,transparent 0 31px,rgba(160,120,70,.055) 32px);
  padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  user-select:none;
  -webkit-user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
h1{font-weight:800;letter-spacing:-.03em}
.top{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  min-height:48px;
}
.back{
  justify-self:start;
  min-width:48px;
  min-height:48px;
  padding:8px 10px;
  border:0;
  background:transparent;
  color:var(--edge);
  font-weight:800;
  font-size:1.05rem;
  border-radius:12px;
}
.back.is-off{visibility:hidden}
.brand{margin:0;font-size:.95rem;font-weight:800;text-align:center}
.dots{justify-self:end;display:flex;gap:6px;padding-right:4px}
.dots i{
  width:8px;height:8px;border-radius:50%;
  background:rgba(141,98,68,.28);
  display:block;
}
.dots i.on{background:var(--edge)}
.stop{
  margin:0 0 8px;
  text-align:center;
  color:var(--muted);
  font-size:.82rem;
}
.numeral{
  margin:2px 0 0;
  text-align:center;
  font-size:5.2rem;
  line-height:.9;
}
.kannada{
  margin:2px 0 8px;
  text-align:center;
  font-family:"Blocks Kannada","Noto Sans Kannada","Kannada MN",sans-serif;
  font-size:2rem;
  line-height:1.2;
  color:var(--edge);
  min-height:2.4rem;
}
#blocks{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:flex-end;
  gap:6px;
  min-height:80px;
  margin:4px 0 10px;
  padding:4px 0 10px;
  border-bottom:3px solid var(--line);
}
.cube{
  width:62px;
  height:62px;
  padding:0;
  border:0;
  border-radius:16px;
  background:
    linear-gradient(160deg,rgba(255,255,255,.5),transparent 42%),
    linear-gradient(#edc9a6,#c48962 58%,#b0754e);
  box-shadow:inset 0 -7px 0 rgba(110,60,30,.16),0 3px 0 var(--edge);
  color:#6a3b24;
  display:inline-flex;
  align-items:center;
  justify-content:center;
}
.cube:active{transform:translateY(2px)}
.cube.counted{box-shadow:inset 0 -7px 0 rgba(110,60,30,.16),0 3px 0 var(--edge),0 0 0 3px var(--leaf)}
.cube.arrive{animation:settle .22s ease-out}
@keyframes settle{from{transform:translateY(-12px);opacity:.35}}
.seed{width:68%;height:68%;display:block}
.hint,.said,.fact-line,.lead{
  text-align:center;
  margin:0;
}
.hint{color:var(--muted);font-size:.95rem}
.said{
  min-height:1.5em;
  margin:6px 0 10px;
  font-size:1.2rem;
  font-weight:800;
}
.said .kn{
  font-family:"Blocks Kannada","Noto Sans Kannada","Kannada MN",sans-serif;
  font-weight:400;
  color:var(--edge);
}
.slot,.next{
  width:100%;
  min-height:64px;
  border-radius:18px;
  font-size:1.25rem;
  font-weight:800;
}
.slot{
  border:2.5px solid var(--edge);
  background:var(--card);
  margin:0 0 12px;
}
.slot:active,.next:active{transform:scale(.99)}
.world{
  background:var(--card);
  border-radius:18px;
  padding:12px 14px 14px;
  margin:0 0 12px;
  border:1.5px solid rgba(168,130,60,.28);
}
.kicker{
  margin:0 0 2px;
  font-size:.75rem;
  font-weight:800;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--muted);
}
.world-text{
  margin:0;
  font-size:1.28rem;
  font-weight:800;
  line-height:1.25;
}
.next{
  border:0;
  background:var(--clay-deep);
  color:#fffaf3;
  position:sticky;
  bottom:0;
}
.lead{color:var(--muted);font-size:1rem;margin:0 0 6px}
.together-title{
  margin:0 0 4px;
  text-align:center;
  font-size:2rem;
}
.fact{
  background:var(--card);
  border:1.5px solid rgba(168,130,60,.28);
  border-radius:18px;
  padding:8px 10px 10px;
  margin:0 0 10px;
}
.fact-num{
  margin:0;
  text-align:center;
  font-size:1.8rem;
  font-weight:800;
  line-height:1;
}
.piles{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  gap:8px;
  margin-top:6px;
}
.pile{
  min-width:72px;
  min-height:56px;
  padding:8px 10px;
  border-radius:16px;
  border:2px dashed rgba(141,98,68,.5);
  background:transparent;
}
.pile:active{background:rgba(196,160,86,.22)}
.stack{display:flex;flex-direction:column-reverse;align-items:center;gap:4px}
.pile .cube{width:40px;height:40px;border-radius:12px;box-shadow:inset 0 -4px 0 rgba(110,60,30,.16),0 2px 0 var(--edge);pointer-events:none}
.and{font-weight:800;color:var(--muted);padding-bottom:14px}
.fact-line{font-weight:800;margin-top:6px;min-height:1.3em}
.sr{
  position:absolute;
  width:1px;height:1px;
  padding:0;margin:-1px;
  overflow:hidden;
  clip:rect(0 0 0 0);
  white-space:nowrap;
  border:0;
}
@media (max-width:380px){
  .cube{width:52px;height:52px;border-radius:14px}
  .numeral{font-size:4.4rem}
}
@media (prefers-reduced-motion:reduce){
  .cube.arrive{animation:none}
}
</style>
</head>
<body>
<header class="top">
  <button class="back" id="back" type="button">← Back</button>
  <p class="brand">Blocks</p>
  <div class="dots" id="dots" aria-hidden="true"></div>
</header>
<p class="stop">Stop when she stops. Turn off silent switch if quiet.</p>
<main id="stage"></main>
<script>
/* Original clay cubes for this page. One repeated seed mark, earth clay, no names.
   Do not import television number-character names, rainbow colours, songs, or faces. */
(function () {
  'use strict';

  var NUMBERS = [
    { n: 1, en: 'one', kn: 'ಒಂದು', world: 'Hold up 1 finger.' },
    { n: 2, en: 'two', kn: 'ಎರಡು', world: 'Find 2 shoes.' },
    { n: 3, en: 'three', kn: 'ಮೂರು', world: 'Build 3 with your blocks.' },
    { n: 4, en: 'four', kn: 'ನಾಲ್ಕು', world: 'Find 4 spoons.' },
    { n: 5, en: 'five', kn: 'ಐದು', world: 'Clap 5 times.' }
  ];
  var SIX = { en: 'six' };

  var index = 0;
  var six = false;
  var arrived = false;
  var line = '';
  var joined = { 4: false, 5: false };
  var factLine = { 4: '2 and 2', 5: '3 and 2' };
  var pendingKn = '';

  var stage = document.getElementById('stage');
  var backBtn = document.getElementById('back');
  var dots = document.getElementById('dots');

  function knVoice() {
    var synth = window.speechSynthesis;
    if (!synth || !synth.getVoices) return null;
    var list = [];
    try { list = synth.getVoices() || []; } catch (e) { return null; }
    for (var i = 0; i < list.length; i++) {
      var lang = String(list[i].lang || '').toLowerCase();
      if (lang.indexOf('kn') === 0) return list[i];
    }
    return null;
  }

  function say(en, kn) {
    var synth = window.speechSynthesis;
    if (!synth || !en) return;
    try { synth.cancel(); } catch (e) {}
    try {
      var u = new SpeechSynthesisUtterance(en);
      u.lang = 'en-US';
      u.rate = 0.88;
      synth.speak(u);
    } catch (e) {}
    pendingKn = kn || '';
    if (!kn) return;
    var voice = knVoice();
    if (!voice) return;
    pendingKn = '';
    speakKn(kn, voice);
  }

  function speakKn(kn, voice) {
    var synth = window.speechSynthesis;
    if (!synth) return;
    try {
      var k = new SpeechSynthesisUtterance(kn);
      k.lang = voice.lang || 'kn-IN';
      k.rate = 0.85;
      try { k.voice = voice; } catch (e2) {}
      synth.speak(k);
    } catch (e3) {}
  }

  function wordFor(count) {
    if (count >= 1 && count <= 5) return NUMBERS[count - 1];
    if (count === 6) return SIX;
    return null;
  }

  function seed() {
    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', 'seed');
    svg.setAttribute('viewBox', '0 0 48 48');
    svg.setAttribute('aria-hidden', 'true');
    function dot(cx) {
      var c = document.createElementNS(ns, 'circle');
      c.setAttribute('cx', String(cx));
      c.setAttribute('cy', '20');
      c.setAttribute('r', '2.1');
      c.setAttribute('fill', 'currentColor');
      return c;
    }
    var path = document.createElementNS(ns, 'path');
    path.setAttribute('d', 'M16 30c3.4 3.4 12.6 3.4 16 0');
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', 'currentColor');
    path.setAttribute('stroke-width', '2.2');
    path.setAttribute('stroke-linecap', 'round');
    svg.appendChild(dot(17));
    svg.appendChild(dot(31));
    svg.appendChild(path);
    return svg;
  }

  function cube(asButton, isArrive) {
    var el = document.createElement(asButton ? 'button' : 'span');
    if (asButton) el.type = 'button';
    el.className = 'cube' + (isArrive ? ' arrive' : '');
    el.appendChild(seed());
    if (asButton) el.setAttribute('aria-label', 'Block');
    return el;
  }

  function setSaid(node, text, kn) {
    node.textContent = '';
    node.appendChild(document.createTextNode(text));
    if (kn) {
      node.appendChild(document.createTextNode(' · '));
      var span = document.createElement('span');
      span.className = 'kn';
      span.lang = 'kn';
      span.textContent = kn;
      node.appendChild(span);
    }
  }

  function paintDots() {
    dots.textContent = '';
    for (var i = 0; i < 6; i++) {
      var mark = document.createElement('i');
      if (i === index) mark.className = 'on';
      dots.appendChild(mark);
    }
  }

  function renderNumber() {
    var info = NUMBERS[index];
    var show = six ? 6 : info.n;
    var screen = document.createElement('section');
    screen.id = 'screen-number';
    screen.setAttribute('data-n', String(show));

    var h = document.createElement('h1');
    h.className = 'numeral';
    h.id = 'numeral';
    h.textContent = String(show);
    screen.appendChild(h);

    var kn = document.createElement('p');
    kn.className = 'kannada';
    kn.id = 'kannada';
    kn.lang = 'kn';
    if (!six) kn.textContent = info.kn;
    screen.appendChild(kn);

    var row = document.createElement('div');
    row.id = 'blocks';
    for (var i = 0; i < show; i++) {
      var b = cube(true, arrived && i === show - 1);
      b.addEventListener('click', onBlock);
      row.appendChild(b);
    }
    screen.appendChild(row);
    arrived = false;

    var hint = document.createElement('p');
    hint.className = 'hint';
    hint.id = 'hint';
    hint.textContent = 'Tap each block.';
    screen.appendChild(hint);

    var said = document.createElement('p');
    said.className = 'said';
    said.id = 'said';
    said.setAttribute('aria-live', 'polite');
    said.textContent = line;
    screen.appendChild(said);

    var slot = document.createElement('button');
    slot.className = 'slot';
    slot.id = 'add-one';
    slot.type = 'button';
    if (six) {
      slot.textContent = 'Back to 5';
      slot.addEventListener('click', function () {
        six = false;
        line = '';
        render();
      });
    } else {
      slot.textContent = 'Add one';
      slot.addEventListener('click', onAdd);
    }
    screen.appendChild(slot);

    var world = document.createElement('aside');
    world.className = 'world';
    world.id = 'world';
    var kicker = document.createElement('p');
    kicker.className = 'kicker';
    kicker.textContent = 'Try this';
    var wt = document.createElement('p');
    wt.className = 'world-text';
    wt.id = 'world-text';
    wt.textContent = six ? 'Six is for another day.' : info.world;
    world.appendChild(kicker);
    world.appendChild(wt);
    screen.appendChild(world);

    screen.appendChild(nextButton('Next'));
    stage.appendChild(screen);
  }

  function pile(count) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'pile';
    btn.setAttribute('aria-label', count + (count === 1 ? ' block' : ' blocks'));
    var stack = document.createElement('span');
    stack.className = 'stack';
    for (var i = 0; i < count; i++) stack.appendChild(cube(false, false));
    btn.appendChild(stack);
    return btn;
  }

  function renderFact(total, parts) {
    var section = document.createElement('section');
    section.className = 'fact';
    section.id = 'fact-' + total;
    section.setAttribute('data-total', String(total));
    section.setAttribute('data-joined', joined[total] ? 'true' : 'false');

    var num = document.createElement('p');
    num.className = 'fact-num';
    num.textContent = String(total);
    section.appendChild(num);

    var piles = document.createElement('div');
    piles.className = 'piles';
    if (joined[total]) {
      var one = pile(total);
      one.addEventListener('click', function () { toggleFact(total, parts); });
      piles.appendChild(one);
    } else {
      var left = pile(parts[0]);
      var right = pile(parts[1]);
      var go = function () { toggleFact(total, parts); };
      left.addEventListener('click', go);
      right.addEventListener('click', go);
      var and = document.createElement('span');
      and.className = 'and';
      and.textContent = 'and';
      piles.appendChild(left);
      piles.appendChild(and);
      piles.appendChild(right);
    }
    section.appendChild(piles);

    var lineEl = document.createElement('p');
    lineEl.className = 'fact-line';
    lineEl.textContent = factLine[total];
    section.appendChild(lineEl);
    return section;
  }

  function renderTogether() {
    var screen = document.createElement('section');
    screen.id = 'screen-together';

    var h = document.createElement('h1');
    h.className = 'together-title';
    h.textContent = 'Together';
    screen.appendChild(h);

    var lead = document.createElement('p');
    lead.className = 'lead';
    lead.textContent = 'Tap to join. Tap to split.';
    screen.appendChild(lead);

    screen.appendChild(renderFact(4, [2, 2]));
    screen.appendChild(renderFact(5, [3, 2]));

    var said = document.createElement('p');
    said.className = 'said sr';
    said.id = 'said';
    said.setAttribute('aria-live', 'polite');
    said.textContent = line;
    screen.appendChild(said);

    var next = nextButton('Again');
    screen.appendChild(next);
    stage.appendChild(screen);
  }

  function nextButton(label) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'next';
    btn.id = 'next';
    btn.textContent = label;
    btn.addEventListener('click', onNext);
    return btn;
  }

  function render() {
    stage.textContent = '';
    paintDots();
    backBtn.classList.toggle('is-off', index === 0);
    backBtn.disabled = index === 0;
    if (index < 5) renderNumber();
    else renderTogether();
  }

  function onBlock(ev) {
    var btn = ev.currentTarget;
    var row = document.getElementById('blocks');
    var blocks = row.querySelectorAll('.cube');
    var n = btn.getAttribute('data-count');
    if (!n) {
      var used = 0;
      for (var i = 0; i < blocks.length; i++) if (blocks[i].getAttribute('data-count')) used++;
      n = String(used + 1);
      btn.setAttribute('data-count', n);
      btn.classList.add('counted');
      btn.setAttribute('aria-label', 'Block ' + n);
    }
    var info = wordFor(Number(n));
    if (!info) return;
    var said = document.getElementById('said');
    if (said) setSaid(said, info.en, info.kn || '');
    say(info.en, info.kn || '');
  }

  function onAdd() {
    var info = NUMBERS[index];
    line = info.n + ' and 1 make ' + (info.n + 1);
    if (info.n < 5) {
      index += 1;
      six = false;
      arrived = true;
    } else {
      six = true;
      arrived = true;
    }
    render();
    say(line, '');
  }

  function toggleFact(total, parts) {
    if (joined[total]) {
      joined[total] = false;
      line = total + ' is ' + parts[0] + ' and ' + parts[1];
    } else {
      joined[total] = true;
      line = parts[0] + ' and ' + parts[1] + ' make ' + total;
    }
    factLine[total] = line;
    render();
    say(line, '');
  }

  function onNext() {
    line = '';
    six = false;
    arrived = false;
    if (index < 5) index += 1;
    else {
      index = 0;
      joined[4] = false;
      joined[5] = false;
      factLine[4] = '2 and 2';
      factLine[5] = '3 and 2';
    }
    render();
  }

  backBtn.addEventListener('click', function () {
    if (index === 0) return;
    line = '';
    arrived = false;
    if (index === 4 && six) {
      six = false;
      render();
      return;
    }
    six = false;
    index -= 1;
    render();
  });

  if (window.speechSynthesis && speechSynthesis.getVoices) {
    try { speechSynthesis.getVoices(); } catch (e) {}
    speechSynthesis.addEventListener('voiceschanged', function () {
      try { speechSynthesis.getVoices(); } catch (e) {}
      if (!pendingKn) return;
      var voice = knVoice();
      if (!voice) return;
      var word = pendingKn;
      pendingKn = '';
      speakKn(word, voice);
    });
  }

  render();
})();
</script>
</body>
</html>
