<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Ane — bold backyard</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#111}
body{font-family:"Avenir Next Rounded","Trebuchet MS",ui-rounded,system-ui,sans-serif}
.screen{width:390px;height:844px;position:relative;overflow:hidden;background:#1EB6D9}
.sky{position:absolute;z-index:0}
.ground{position:absolute;z-index:1}
.prop{position:absolute;z-index:2}
.actor,.cast,.bubbles{position:absolute;z-index:5}
.ui{position:absolute;z-index:4}
.sun{top:28px;right:36px;width:92px;height:92px;border-radius:50%;background:#FFC83D}
.cloud{background:#fff;border-radius:40px}
.c1{top:54px;left:28px;width:110px;height:36px}
.c1:before,.c1:after{content:"";position:absolute;background:#fff;border-radius:50%}
.c1:before{width:46px;height:46px;top:-22px;left:18px}
.c1:after{width:36px;height:36px;top:-16px;left:52px}
.c2{top:96px;right:110px;width:72px;height:26px}
.hill-far{left:0;right:0;bottom:210px;height:220px;background:#1B7A45;border-radius:50% 50% 0 0}
.hill-near{left:0;right:0;bottom:0;height:240px;background:#2FA84A;border-radius:46% 54% 0 0}
.house{left:18px;bottom:168px;width:132px;height:118px}
.wall{position:absolute;left:8px;bottom:0;width:116px;height:78px;background:#FF5D4A;border-radius:8px 8px 0 0}
.roof{position:absolute;left:0;bottom:68px;width:0;height:0;border-left:66px solid transparent;border-right:66px solid transparent;border-bottom:52px solid #5A2D82}
.door{position:absolute;left:48px;bottom:0;width:28px;height:42px;background:#FFD15A;border-radius:8px 8px 0 0}
.post{position:absolute;left:0;bottom:0;width:10px;height:70px;background:#E7A23A}
.rail{position:absolute;left:0;bottom:36px;width:48px;height:8px;background:#FFD15A;border-radius:4px}
.tree{right:8px;bottom:150px;width:150px;height:210px}
.trunk{position:absolute;left:62px;bottom:0;width:22px;height:90px;background:#D06A1A;border-radius:8px}
.canopy{position:absolute;border-radius:50%;background:#128A3C}
.canopy.a{width:110px;height:90px;left:16px;bottom:70px}
.canopy.b{width:80px;height:70px;left:0;bottom:100px;background:#0C6A2C}
.canopy.c{width:78px;height:68px;right:0;bottom:96px;background:#1FA34A}
.fruit{position:absolute;width:16px;height:18px;border-radius:50%;background:#FF8C1A}
.caption{
  left:16px;right:16px;bottom:22px;background:#fff;border-radius:28px;
  padding:16px 18px 18px;color:#1A1A1A;text-align:center;
}
.caption p{margin:0;font-size:1.45rem;font-weight:800;line-height:1.15;letter-spacing:-.02em}
.btn{
  display:block;margin-top:12px;width:100%;min-height:72px;border:0;border-radius:20px;
  background:#FF8C1A;color:#fff;font:inherit;font-size:1.45rem;font-weight:800;
}
h1{position:absolute;left:0;right:0;top:118px;margin:0;text-align:center;color:#fff;font-size:2rem;letter-spacing:-.03em;text-shadow:0 3px 0 #0E6E86}
.cast{position:absolute;left:0;right:0;bottom:175px;display:flex;justify-content:space-around;align-items:flex-end;padding:0 4px;z-index:5}
.name{display:block;text-align:center;color:#fff;font-weight:800;font-size:1.15rem;margin-top:2px}
.hud{left:16px;right:16px;top:22px;display:flex;align-items:center;justify-content:space-between}
.pill{background:#fff;border-radius:999px;padding:8px 14px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.5rem;color:#1A1A1A;font-variant-numeric:tabular-nums}
.bubbles{position:absolute;left:0;right:0;bottom:168px;display:flex;justify-content:center;gap:12px}
.bubble{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;position:relative}
.bubble i{width:78px;height:78px;border-radius:50%;background:#fff;color:#1A1A1A;display:grid;place-items:center;font-style:normal;font-size:2.7rem;font-weight:800;font-variant-numeric:tabular-nums}
.b1{background:#FF8C1A}.b2{background:#1FA971}.b3{background:#7C4DFF}
.burst{position:absolute;inset:-8px}
.wiggle{transform:rotate(-10deg) translateY(8px)}
.ticks{position:absolute;right:-18px;top:18px}
.say{position:absolute;left:70px;top:250px;background:#fff;color:#1A1A1A;font-weight:800;font-size:1.35rem;padding:10px 14px;border-radius:18px}
.confetti i{position:absolute;border-radius:3px}
</style>
</head>
<body>

<section class="screen" id="story">
  <div class="sun sky"></div>
  <div class="cloud c1 sky"></div>
  <div class="cloud c2 sky"></div>
  <div class="hill-far ground"></div>
  <div class="hill-near ground"></div>
  <div class="house prop">
    <div class="roof"></div><div class="wall"></div><div class="door"></div>
    <div class="post"></div><div class="rail"></div>
  </div>
  <div class="tree prop">
    <div class="trunk"></div>
    <div class="canopy b"></div><div class="canopy c"></div><div class="canopy a"></div>
    <i class="fruit" style="left:40px;bottom:120px"></i>
    <i class="fruit" style="left:78px;bottom:140px"></i>
    <i class="fruit" style="left:100px;bottom:112px"></i>
  </div>
  <!-- Sad Ane, sitting, trunk down -->
  <svg class="actor" style="left:70px;bottom:210px;width:250px" viewBox="0 0 360 420" aria-label="Ane, sad">
    <path d="M255 240 C310 255 318 310 278 322 C300 308 292 268 252 256 Z" fill="#3E749E"/>
    <ellipse cx="175" cy="292" rx="112" ry="78" fill="#5B95C4"/>
    <ellipse cx="175" cy="314" rx="68" ry="38" fill="#3E749E"/>
    <rect x="112" y="328" width="58" height="72" rx="28" fill="#5B95C4"/>
    <rect x="196" y="334" width="58" height="68" rx="28" fill="#5B95C4"/>
    <ellipse cx="72" cy="168" rx="74" ry="100" fill="#4E86B8" transform="rotate(-16 72 168)"/>
    <ellipse cx="76" cy="178" rx="46" ry="66" fill="#FF7A9C" transform="rotate(-16 76 178)"/>
    <ellipse cx="278" cy="160" rx="74" ry="100" fill="#4E86B8" transform="rotate(14 278 160)"/>
    <ellipse cx="272" cy="170" rx="46" ry="66" fill="#FF7A9C" transform="rotate(14 272 170)"/>
    <circle cx="176" cy="158" r="90" fill="#6AA6D4"/>
    <ellipse cx="148" cy="150" rx="18" ry="20" fill="#F7FBFF"/>
    <ellipse cx="208" cy="152" rx="18" ry="20" fill="#F7FBFF"/>
    <circle cx="152" cy="156" r="9" fill="#16324A"/>
    <circle cx="212" cy="158" r="9" fill="#16324A"/>
    <path d="M118 122 C136 100 158 108 164 128 C150 112 128 112 118 122 Z" fill="#3E749E"/>
    <path d="M192 128 C202 106 230 102 246 124 C228 110 204 112 192 128 Z" fill="#3E749E"/>
    <rect x="150" y="188" width="54" height="150" rx="27" fill="#5B95C4"/>
    <circle cx="132" cy="332" r="34" fill="#5B95C4"/>
    <circle cx="104" cy="316" r="24" fill="#5B95C4"/>
    <rect x="150" y="196" width="22" height="130" rx="11" fill="#3E749E"/>
    <ellipse cx="126" cy="186" rx="16" ry="9" fill="#FF9AB4"/>
    <ellipse cx="226" cy="188" rx="16" ry="9" fill="#FF9AB4"/>
  </svg>
  <i class="fruit prop" style="left:250px;bottom:175px;width:22px;height:26px"></i>
  <div class="ui caption">
    <p>Ane the baby elephant lost her 5 mangoes. Help her find them!</p>
    <button class="btn" type="button">Skip</button>
  </div>
</section>

<section class="screen" id="pick">
  <div class="sun sky"></div>
  <div class="cloud c1 sky"></div>
  <div class="hill-far ground"></div>
  <div class="hill-near ground"></div>
  <div class="tree prop" style="right:0;bottom:120px;transform:scale(.7);transform-origin:bottom right">
    <div class="trunk"></div><div class="canopy a"></div>
    <i class="fruit" style="left:50px;bottom:120px"></i>
  </div>
  <h1>Who will help?</h1>
  <div class="cast">
    <div>
      <svg width="118" height="156" viewBox="0 0 170 210" aria-label="Myna the parrot">
        <path d="M78 188 C40 188 28 150 48 128 C22 118 24 78 58 86 C52 40 100 28 112 78 C150 60 176 110 148 140 C168 168 120 196 78 188 Z" fill="#1FA971"/>
        <ellipse cx="96" cy="132" rx="30" ry="22" fill="#157A52"/>
        <path d="M124 108 L168 122 L128 142 Z" fill="#FFD23A"/>
        <path d="M70 78 C88 28 130 36 118 86 Z" fill="#FF4D6A"/>
        <path d="M36 118 C8 86 22 52 58 74 Z" fill="#FFD23A"/>
        <path d="M24 168 C8 150 18 128 46 142 Z" fill="#157A52"/>
        <circle cx="118" cy="104" r="8" fill="#10281C"/>
        <circle cx="120" cy="102" r="3" fill="#fff"/>
        <path d="M96 90 C110 78 130 82 136 98 C122 88 104 88 96 90 Z" fill="#0C5A38"/>
      </svg>
      <span class="name">Myna</span>
    </div>
    <div>
      <svg width="118" height="168" viewBox="0 0 170 220" aria-label="Kapi the monkey">
        <path d="M128 150 C176 168 184 112 150 96 C162 70 140 48 124 72 Z" fill="#C4890A"/>
        <ellipse cx="82" cy="146" rx="48" ry="40" fill="#F0B429"/>
        <ellipse cx="82" cy="158" rx="28" ry="18" fill="#C4890A"/>
        <circle cx="80" cy="86" r="40" fill="#F6C453"/>
        <circle cx="36" cy="78" r="18" fill="#F0B429"/>
        <circle cx="124" cy="74" r="18" fill="#F0B429"/>
        <circle cx="36" cy="78" r="9" fill="#FFE3A3"/>
        <circle cx="124" cy="74" r="9" fill="#FFE3A3"/>
        <ellipse cx="80" cy="102" rx="18" ry="14" fill="#E09A22"/>
        <circle cx="66" cy="80" r="6" fill="#3A2410"/>
        <circle cx="98" cy="78" r="6" fill="#3A2410"/>
        <path d="M18 108 C-4 70 16 36 48 52 C28 74 26 98 44 116 Z" fill="#F0B429"/>
        <ellipse cx="62" cy="188" rx="18" ry="14" fill="#F0B429"/>
        <ellipse cx="108" cy="176" rx="18" ry="14" fill="#F0B429"/>
      </svg>
      <span class="name">Kapi</span>
    </div>
    <div>
      <svg width="124" height="156" viewBox="0 0 180 200" aria-label="Pup">
        <ellipse cx="48" cy="78" rx="26" ry="40" fill="#FF6A3D" transform="rotate(-28 48 78)"/>
        <ellipse cx="132" cy="70" rx="26" ry="40" fill="#FF6A3D" transform="rotate(32 132 70)"/>
        <ellipse cx="92" cy="118" rx="52" ry="40" fill="#FF6A3D" transform="rotate(-8 92 118)"/>
        <ellipse cx="96" cy="128" rx="30" ry="20" fill="#FF8F6A"/>
        <circle cx="96" cy="70" r="36" fill="#FF7A4A"/>
        <ellipse cx="112" cy="88" rx="22" ry="16" fill="#FFD0B8"/>
        <ellipse cx="118" cy="90" rx="7" ry="5" fill="#6A2412"/>
        <circle cx="82" cy="62" r="6" fill="#2A120C"/>
        <circle cx="110" cy="58" r="6" fill="#2A120C"/>
        <ellipse cx="58" cy="162" rx="18" ry="13" fill="#FF6A3D"/>
        <ellipse cx="124" cy="150" rx="18" ry="13" fill="#FF6A3D"/>
        <path d="M140 120 C168 110 176 140 150 146 Z" fill="#FF6A3D"/>
      </svg>
      <span class="name">Pup</span>
    </div>
  </div>
</section>

<section class="screen" id="play">
  <div class="sun sky"></div>
  <div class="cloud c2 sky"></div>
  <div class="hill-far ground"></div>
  <div class="hill-near ground"></div>
  <div class="house prop" style="transform:scale(.85);transform-origin:bottom left"></div>
  <div class="tree prop" style="transform:scale(.75);transform-origin:bottom right">
    <div class="trunk"></div><div class="canopy a"></div>
  </div>
  <div class="hud ui">
    <div class="chip" style="width:64px;height:64px;border-radius:18px;background:#fff;display:grid;place-items:center;font-size:2rem;font-weight:800;color:#16324A">‹</div>
    <div class="pill"><i class="fruit" style="position:relative;width:22px;height:26px"></i> 1/5</div>
    <div style="width:64px;height:64px;border-radius:18px;background:#fff;display:grid;place-items:center">
      <svg width="32" height="32" viewBox="0 0 48 48" aria-hidden="true"><path d="M10 18h8l10-8v28L18 30h-8z" fill="#16324A"/><path d="M34 16c5 4 5 12 0 16" fill="none" stroke="#16324A" stroke-width="4" stroke-linecap="round"/></svg>
    </div>
  </div>
  <svg class="actor" style="left:6px;top:150px;width:150px" viewBox="0 0 160 190" aria-hidden="true">
    <path d="M20 70 C-10 20 30 0 55 30 Z" fill="#FFD23A"/>
    <path d="M130 40 C170 10 180 60 140 70 Z" fill="#FFD23A"/>
    <path d="M30 150 C10 110 30 70 60 78 C40 40 80 30 90 70 C130 30 170 80 140 120 C165 150 120 175 90 150 C70 175 40 170 30 150 Z" fill="#1FA971"/>
    <ellipse cx="96" cy="112" rx="26" ry="18" fill="#178A5C"/>
    <path d="M120 96 L158 112 L124 128 Z" fill="#FFD23A"/>
    <circle cx="112" cy="90" r="7" fill="#143024"/>
    <path d="M90 78 C102 64 122 66 128 82 C116 70 98 72 90 78 Z" fill="#0E5C40"/>
  </svg>
  <div class="ui" style="left:150px;top:168px;width:150px;height:150px;border-radius:50%;background:#fff;display:grid;place-items:center;color:#1A1A1A;font-size:6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1">3</div>
  <div class="bubbles">
    <div class="bubble b1"><i>1</i></div>
    <div class="bubble b2">
      <svg class="burst" viewBox="0 0 120 120" aria-hidden="true">
        <polygon points="60,4 68,28 60,22 52,28" fill="#FFC83D"/>
        <polygon points="112,40 86,48 96,40 88,32" fill="#FF5D4A"/>
        <polygon points="8,48 34,42 24,50 30,58" fill="#FF8C1A"/>
        <polygon points="96,96 78,78 88,86 80,96" fill="#7C4DFF"/>
      </svg>
      <i>3</i>
    </div>
    <div class="bubble b3"><i>5</i></div>
  </div>
  <svg class="actor" style="left:176px;top:300px;width:42px" viewBox="0 0 48 48" aria-hidden="true"><ellipse cx="24" cy="28" rx="14" ry="16" fill="#FF8C1A"/><path d="M24 10c5 7 12 8 16 3" fill="#128A3C"/></svg>
</section>

<section class="screen" id="wrong">
  <div class="sun sky"></div>
  <div class="cloud c1 sky"></div>
  <div class="hill-far ground"></div>
  <div class="hill-near ground"></div>
  <div class="tree prop" style="transform:scale(.8);transform-origin:bottom right"><div class="trunk"></div><div class="canopy a"></div></div>
  <div class="hud ui">
    <div style="width:64px;height:64px;border-radius:18px;background:#fff;display:grid;place-items:center;font-size:2rem;font-weight:800">‹</div>
    <div class="pill"><i class="fruit" style="position:relative;width:22px;height:26px"></i> 1/5</div>
    <div style="width:64px;height:64px"></div>
  </div>
  <svg class="actor" style="left:8px;top:250px;width:200px" viewBox="0 0 180 200" aria-hidden="true">
    <path d="M150 90 C190 70 196 120 160 124 Z" fill="#FFD23A"/>
    <path d="M40 160 C16 120 36 80 70 90 C48 50 90 40 96 84 C140 50 186 100 150 140 C170 170 110 190 80 160 C60 188 40 184 40 160 Z" fill="#1FA971"/>
    <ellipse cx="100" cy="124" rx="28" ry="20" fill="#178A5C"/>
    <path d="M128 108 L166 122 L132 138 Z" fill="#FFD23A"/>
    <circle cx="118" cy="104" r="7" fill="#143024"/>
    <path d="M96 92 C110 86 128 90 132 104 C120 94 104 92 96 92 Z" fill="#0E5C40"/>
  </svg>
  <div class="say" style="left:150px;top:280px">Try again!</div>
  <div class="bubbles" style="bottom:150px">
    <div class="bubble b1"><i>1</i></div>
    <div class="bubble b2 wiggle">
      <svg class="ticks" width="28" height="40" viewBox="0 0 28 40" aria-hidden="true">
        <path d="M4 8 Q16 4 14 16" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
        <path d="M8 22 Q20 18 16 32" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <i>4</i>
    </div>
    <div class="bubble b3"><i>5</i></div>
  </div>
</section>

<section class="screen" id="win">
  <div class="sun sky"></div>
  <div class="cloud c2 sky"></div>
  <div class="hill-far ground"></div>
  <div class="hill-near ground"></div>
  <div class="house prop"></div>
  <div class="tree prop"><div class="trunk"></div><div class="canopy b"></div><div class="canopy a"></div></div>
  <div class="confetti" aria-hidden="true">
    <i style="left:30px;top:40px;width:14px;height:22px;background:#FF5D4A;transform:rotate(20deg)"></i>
    <i style="left:80px;top:90px;width:12px;height:12px;background:#FFC83D;border-radius:50%"></i>
    <i style="right:40px;top:70px;width:16px;height:16px;background:#7C4DFF;transform:rotate(30deg)"></i>
    <i style="right:90px;top:130px;width:10px;height:18px;background:#FF8C1A;transform:rotate(-25deg)"></i>
    <i style="left:150px;top:36px;width:14px;height:14px;background:#1FA971;border-radius:50%"></i>
    <i style="left:40px;top:180px;width:12px;height:18px;background:#FF7A9C;transform:rotate(40deg)"></i>
    <i style="right:24px;top:200px;width:14px;height:14px;background:#FFC83D;border-radius:50%"></i>
  </div>
  <svg class="actor" style="left:78px;bottom:220px;width:230px" viewBox="0 0 360 420" aria-label="Ane, happy">
    <path d="M250 230 C312 250 320 300 280 312 C304 296 298 258 248 246 Z" fill="#3E749E"/>
    <ellipse cx="170" cy="286" rx="108" ry="74" fill="#5B95C4"/>
    <ellipse cx="170" cy="306" rx="62" ry="34" fill="#3E749E"/>
    <rect x="108" y="322" width="54" height="70" rx="26" fill="#5B95C4"/>
    <rect x="200" y="292" width="52" height="64" rx="26" fill="#5B95C4" transform="rotate(-22 226 324)"/>
    <ellipse cx="68" cy="168" rx="72" ry="96" fill="#4E86B8" transform="rotate(-18 68 168)"/>
    <ellipse cx="72" cy="176" rx="44" ry="62" fill="#FF7A9C" transform="rotate(-18 72 176)"/>
    <ellipse cx="268" cy="150" rx="72" ry="96" fill="#4E86B8" transform="rotate(16 268 150)"/>
    <ellipse cx="262" cy="158" rx="44" ry="62" fill="#FF7A9C" transform="rotate(16 262 158)"/>
    <circle cx="168" cy="162" r="86" fill="#6AA6D4"/>
    <ellipse cx="142" cy="152" rx="17" ry="19" fill="#F7FBFF"/>
    <ellipse cx="198" cy="148" rx="17" ry="19" fill="#F7FBFF"/>
    <circle cx="142" cy="148" r="8" fill="#16324A"/>
    <circle cx="198" cy="144" r="8" fill="#16324A"/>
    <path d="M114 128 C132 106 154 114 158 132 C144 116 124 116 114 128 Z" fill="#3E749E"/>
    <path d="M184 124 C196 102 224 100 238 122 C220 108 196 110 184 124 Z" fill="#3E749E"/>
    <ellipse cx="198" cy="196" rx="30" ry="22" fill="#5B95C4"/>
    <ellipse cx="232" cy="168" rx="28" ry="22" fill="#5B95C4" transform="rotate(-28 232 168)"/>
    <ellipse cx="256" cy="132" rx="26" ry="20" fill="#5B95C4" transform="rotate(-50 256 132)"/>
    <circle cx="262" cy="98" r="22" fill="#5B95C4"/>
    <ellipse cx="124" cy="186" rx="13" ry="8" fill="#FF9AB4"/>
    <ellipse cx="210" cy="180" rx="13" ry="8" fill="#FF9AB4"/>
  </svg>
  <div class="ui caption">
    <div style="display:flex;justify-content:center;gap:6px;margin-bottom:8px">
      <i class="fruit" style="position:relative"></i><i class="fruit" style="position:relative"></i><i class="fruit" style="position:relative"></i><i class="fruit" style="position:relative"></i><i class="fruit" style="position:relative"></i>
    </div>
    <p>Now find 3 real spoons!</p>
    <button class="btn" type="button">Play again</button>
  </div>
</section>
</body>
</html>
