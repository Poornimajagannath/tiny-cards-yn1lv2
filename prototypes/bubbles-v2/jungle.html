<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Grove — Ane's mangoes</title>
<style>
:root{
  --sky1:#3EC6FF;--sky2:#B6F26A;--ground:#2F9E44;--hill:#7ED957;
  --ink:#143024;--shadow:#C45C12;--go:#FF7A00;--go-shadow:#C45000;
  --b1:#FF8A1E;--b2:#19A85A;--b3:#FF4F93;
}

*{box-sizing:border-box}
html,body{margin:0;background:#111}
body{font-family:"Avenir Next Rounded","Trebuchet MS",ui-rounded,system-ui,sans-serif;color:var(--ink)}
.screen{
  width:390px;height:844px;margin:0 auto;position:relative;overflow:hidden;
  background:linear-gradient(180deg,var(--sky1),var(--sky2) 62%,var(--ground));
  display:flex;flex-direction:column;align-items:center;padding:28px 18px 22px;
}
.screen + .screen{margin-top:0}
h1{margin:8px 0 0;font-size:2rem;letter-spacing:-.03em;text-align:center;line-height:1.05}
.card{
  background:#fff;border-radius:28px;padding:16px 18px;
  box-shadow:0 10px 0 var(--shadow);
  text-align:center;width:100%;
}
.story-line{margin:0;font-size:1.45rem;font-weight:800;line-height:1.2}
.go{
  margin-top:auto;width:100%;min-height:88px;border:0;border-radius:24px;
  background:var(--go);color:#fff;font:inherit;font-weight:800;font-size:1.5rem;
  box-shadow:0 6px 0 var(--go-shadow);
}
.card{margin-bottom:14px}
.ane{width:280px;height:auto;margin-top:8px}
.friends{width:100%;display:flex;flex-direction:column;gap:12px;margin-top:18px}
.friend{
  min-height:112px;border:0;border-radius:28px;background:#fff;
  display:flex;align-items:center;gap:12px;padding:8px 16px;
  box-shadow:0 8px 0 var(--shadow);font:inherit;font-weight:800;font-size:1.7rem;color:var(--ink);
}
.friend svg{width:120px;height:100px;flex:none}
.top{width:100%;display:flex;align-items:center;justify-content:space-between}
.basket{
  background:#fff;border-radius:999px;min-height:64px;padding:8px 16px;
  display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.6rem;
  font-variant-numeric:tabular-nums;box-shadow:0 4px 0 var(--shadow);
}
.basket .mango{width:32px;height:32px}
.ask{display:flex;align-items:center;gap:14px;margin-top:18px}
.ask .who{width:84px;height:74px}
.num{
  width:120px;height:120px;border-radius:50%;background:#fff;color:#142018;
  display:grid;place-items:center;font-size:4.6rem;font-weight:800;line-height:1;
  font-variant-numeric:tabular-nums;box-shadow:0 8px 0 var(--shadow);
}
.bubbles{display:flex;gap:14px;margin-top:auto;margin-bottom:28px}
.bubble{
  width:108px;height:108px;border-radius:50%;display:grid;place-items:center;
  box-shadow:0 8px 0 rgba(0,0,0,.12);
}
.bubble span{
  width:78px;height:78px;border-radius:50%;background:#fff;color:#142018;
  display:grid;place-items:center;font-size:2.8rem;font-weight:800;
  font-variant-numeric:tabular-nums;
}
.b1{background:var(--b1)} .b2{background:var(--b2)} .b3{background:var(--b3)}
.deco{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.hill{position:absolute;left:-10%;right:-10%;bottom:0;height:180px;background:var(--hill);border-radius:50% 50% 0 0}
.screen > *{position:relative;z-index:1}
.deco{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none}
.grove .leaf{position:absolute;z-index:0;font-size:0}
.win-row{display:flex;gap:6px;margin:18px 0}
.spoons{font-size:2rem;font-weight:800;line-height:1.15;margin:8px 0 0}
.chip{
  width:64px;height:64px;border-radius:20px;background:#fff;color:var(--ink);
  display:grid;place-items:center;font-weight:800;font-size:1.8rem;
  box-shadow:0 4px 0 var(--shadow);
}

</style>
</head>
